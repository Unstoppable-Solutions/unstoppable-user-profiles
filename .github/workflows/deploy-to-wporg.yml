name: Deploy to WordPress.org

# Dormant until this plugin is accepted into the WordPress.org directory.
# Add SVN_USERNAME and SVN_PASSWORD secrets in repo settings before the
# first release, and update the SLUG value below to match the plugin's
# WordPress.org slug.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Push to WordPress.org SVN
    # Pinned to ubuntu-24.04 (noble) because `ubuntu-latest` now resolves to
    # 25.10 (resolute), which has intermittent DNS failures resolving
    # archive.ubuntu.com during apt-get install subversion — breaking the
    # 10up deploy action before it can reach WP.org SVN. Noble has stable
    # mirror resolution.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pre-install subversion with retries
        # Install svn BEFORE the 10up action so (1) we control the retry loop
        # for transient apt-get failures, and (2) the action's own `apt-get
        # install subversion` becomes a no-op (it checks `command -v svn` first).
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends subversion; then
              echo "✓ subversion installed on attempt $attempt"
              svn --version | head -1
              exit 0
            fi
            echo "✗ Attempt $attempt failed."
            if [ "$attempt" = "2" ]; then
              echo "Trying public DNS resolvers..."
              sudo bash -c 'printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf'
            fi
            sleep 20
          done
          echo "All apt-get attempts failed." >&2
          exit 1

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: unstoppable-user-profiles

      - name: Upload release zip as a GitHub Release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
